name: Release

on:
  deployment_status:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Recovery only; routine publication uses either completion event above.
  workflow_dispatch:
    inputs:
      sha:
        description: Production source SHA to retry (blank uses current main)
        required: false
        type: string
      dry_run:
        description: Validate and preview notes without publishing
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/release*.js
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  test:
    name: Release guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test release guards
        run: node --test .github/scripts/release.test.js

  release:
    name: Verify and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       github.event.deployment_status.creator.login == 'vercel[bot]' &&
       github.event.deployment_status.state == 'success') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
      # Keep completion events for different commits instead of replacing pending runs.
      queue: max
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Never execute code from a workflow_run's PR head or a preview deployment.
          ref: main
          fetch-depth: 0

      - name: Verify, tag and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.js
